name: Stride
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 0.2.1
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - Stride
      - Shared
      - path: Coach
        type: folder
        buildPhase: resources
    dependencies:
      - target: StrideWatch
      - target: StrideWidgets
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Stride/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Stride
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Stride tracks your route while you run so the coach can tell you your distance and pace, and pauses the clock when you stop.
        NSHealthShareUsageDescription: Stride reads your past running workouts so your plan picks up where you left off.
        NSHealthUpdateUsageDescription: Stride saves each guided run to Health as a running workout.
        NSMicrophoneUsageDescription: Stride records a short voice sample when you choose to build a custom coach voice.
        NSMotionUsageDescription: Stride uses your stride length from the motion sensors to estimate distance on a treadmill.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.stride
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  StrideWatch:
    type: application
    platform: watchOS
    sources:
      - StrideWatch
      - Shared/Plan.swift
      - Shared/RunSync.swift
    entitlements:
      path: StrideWatch/StrideWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: StrideWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Stride
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.assiamah.stride
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Stride reads your heart rate and active energy during a run.
        NSHealthUpdateUsageDescription: Stride saves your runs with heart rate to Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.stride.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  StrideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - StrideWidgets
      - Shared/RunActivityAttributes.swift
      - Shared/RunIntents.swift
    info:
      path: StrideWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Stride
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.stride.widgets
        SKIP_INSTALL: true

schemes:
  Stride:
    build:
      targets:
        Stride: all
  StrideWatch:
    build:
      targets:
        StrideWatch: all
