name: Stride
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - Stride
      - path: Coach
        type: folder
        buildPhase: resources
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Stride/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Stride
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Stride tracks your route while you run so the coach can tell you your distance and pace.
        NSHealthShareUsageDescription: Stride reads your past running workouts so your plan picks up where you left off.
        NSHealthUpdateUsageDescription: Stride saves each guided run to Health as a running workout.
        NSMicrophoneUsageDescription: Stride records a short voice sample when you choose to build a custom coach voice.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.stride
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  Stride:
    build:
      targets:
        Stride: all
