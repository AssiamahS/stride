<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride Privacy</title>
<style>body{margin:0;background:#0a0b0e;color:#fff;font:17px/1.6 -apple-system,system-ui,sans-serif}main{max-width:640px;margin:0 auto;padding:64px 22px}p{color:#b5b8c0}</style></head>
<body><main><h1>Privacy</h1>
<p>Stride has no server and no account. Your runs are stored on your iPhone and, if you allow it, in Apple Health. Location is used only while a run is active to measure distance and pace, and is never uploaded. Personal Voice synthesis happens on-device. Nothing leaves your phone.</p>
</main></body></html>
